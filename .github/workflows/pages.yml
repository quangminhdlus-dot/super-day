name: Kiểm tra và xuất bản Super Day
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: super-day-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: super_day_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Kiểm tra Edge Function
        run: deno check supabase/functions/reminders/index.ts
      - name: Kiểm tra logic ngày, báo cáo và thông báo
        run: npm test
      - name: Kiểm tra PostgreSQL và tách biệt tài khoản
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/super_day_test
      - name: Tạo ứng dụng tĩnh
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Xuất bản GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Kiểm tra hai Service Worker đã xuất bản
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          base = os.environ['SITE_URL'].rstrip('/') + '/'
          workers = {
              'sw.js': 'super-day-shell-',
              'push/OneSignalSDKWorker.js': 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.sw.js',
          }
          for path, marker in workers.items():
              url = urljoin(base, path)
              with urlopen(Request(url, headers={'Cache-Control': 'no-cache'}), timeout=20) as response:
                  content_type = response.headers.get('Content-Type', '')
                  body = response.read().decode('utf-8')
                  assert response.status == 200, f'{url}: HTTP {response.status}'
                  assert 'javascript' in content_type or 'ecmascript' in content_type, f'{url}: sai MIME {content_type}'
                  assert urlparse(response.url).path == urlparse(url).path, f'{url}: bi chuyen huong'
                  assert marker in body, f'{url}: sai noi dung worker'
                  print(f'OK {url} — HTTP 200 — {content_type}')
          PY
